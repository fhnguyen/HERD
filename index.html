<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HERD | WESTWOOD</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   PALETTE + TYPE — carried over from the Throwdown page
   Blue leads. Orange = Scaled. Gold = today / highlights.
   Magenta = caps, misses, warnings.
   ══════════════════════════════════════════════════════ */
:root {
  --blue:      #0044DF;
  --blue-deep: #0033A8;
  --blue-soft: rgba(0,68,223,0.08);
  --gold:      #DC8E09;
  --gold-lt:   #F0A81C;
  --orange:    #E07A1C;
  --orange-ink:#A85A0D;   /* orange/gold as small text on white need these darker shades for contrast */
  --gold-ink:  #8F5C05;
  --magenta:   #CC1266;

  --paper: #FFFFFF;
  --wash:  #F5F7FC;
  --ink:   #14161C;
  --ink-2: #4B5364;
  --ink-3: #7A8496;
  --line:  #E2E7F2;

  --grad: linear-gradient(90deg, var(--magenta) 0%, var(--orange) 52%, var(--gold) 100%);
  --display: 'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif;
  --col: 760px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'DM Sans', system-ui, sans-serif; font-weight: 400;
  background: var(--wash); color: var(--ink);
  -webkit-font-smoothing: antialiased; min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.grad-rule { height: 3px; background: var(--grad); }
.col { max-width: var(--col); margin: 0 auto; }

/* ─── Buttons (from the reference) ─── */
.btn-primary, .btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 700; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
  border-radius: 3px; text-decoration: none; transition: background .2s, color .2s, box-shadow .2s, transform .2s;
  white-space: nowrap;
}
.btn-primary { background: var(--blue); color: #fff; padding: 16px 30px; box-shadow: 0 4px 16px rgba(0,68,223,0.28); }
.btn-primary:hover { background: var(--gold); color: var(--ink); box-shadow: 0 6px 20px rgba(220,142,9,0.35); transform: translateY(-1px); }
.btn-primary:disabled { background: var(--line); color: var(--ink-3); box-shadow: none; transform: none; cursor: default; }
.btn-ghost { background: var(--paper); color: var(--blue); padding: 14px 24px; border: 2px solid var(--blue); }
.btn-ghost:hover { background: var(--blue); color: #fff; box-shadow: 0 5px 18px rgba(0,68,223,0.28); transform: translateY(-1px); }
.btn-ghost--orange { border-color: var(--orange); color: var(--orange-ink); }
.btn-ghost--orange:hover { background: var(--orange); color: #fff; box-shadow: 0 5px 18px rgba(224,122,28,0.32); }
.btn-ghost--magenta { border-color: var(--magenta); color: var(--magenta); }
.btn-ghost--magenta:hover { background: var(--magenta); color: #fff; }
.btn-sm { padding: 11px 16px; letter-spacing: 2px; }
.btn-ghost.btn-sm { padding: 9px 14px; }
.text-btn {
  font-size: 10px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--blue); padding: 8px 2px;
}
.text-btn:hover { color: var(--gold); }
.text-btn--quiet { color: var(--ink-3); }
.text-btn--danger { color: var(--magenta); }

/* ─── Segmented control (from the reference) ─── */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--paper); }
.seg button {
  font-family: var(--display); font-size: 19px; letter-spacing: 1.5px; line-height: 1;
  padding: 10px 20px; color: var(--ink-3); transition: background .18s, color .18s;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.seg button[aria-pressed="true"][data-v="scaled"] { background: var(--orange); }
.seg--sm button { font-size: 16px; padding: 8px 13px; }
.seg button:disabled { color: #B6BECC; background: var(--paper); cursor: default; }
.wk-arrow { font-size: 26px !important; padding: 2px 16px 0 !important; }

/* ─── Nav ─── */
.nav-bar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255,255,255,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 0 18px; padding-top: env(safe-area-inset-top);
}
.nav-inner { max-width: var(--col); margin: 0 auto; height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; text-decoration: none; color: var(--ink); }
.brand img { height: 40px; width: auto; }
.brand-word { font-family: var(--display); font-size: 30px; letter-spacing: 1px; line-height: 1; display: flex; align-items: center; white-space: nowrap; }
.bw-a { color: var(--blue); }
.bw-b { color: var(--orange); }       /* brand orange: 3:1 on white at this size; brand gold would not be */
.bw-sep { display: inline-block; width: 2px; height: 0.62em; background: #C9D0DC; margin: 0 0.32em; position: relative; top: -0.04em; }
@media (max-width: 360px) { .brand-word { font-size: 25px; } }
.nav-actions { display: flex; align-items: center; gap: 10px; }
.me-btn { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); }
.me-btn:hover { border-color: var(--blue); }
.me-name { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-2); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-init { width: 34px; height: 34px; border-radius: 2px; background: var(--blue); color: #fff; font-family: var(--display); font-size: 19px; display: grid; place-items: center; letter-spacing: 0.5px; }
.me-btn[data-role="coach"] .me-init { background: var(--gold); color: var(--ink); }

.demo-bar { background: var(--ink); color: rgba(255,255,255,0.8); font-size: 12.5px; line-height: 1.5; padding: 10px 18px; }
@media (min-width: 700px) { .demo-bar { padding: 10px 28px; } }
.demo-bar b { color: var(--gold-lt); font-weight: 700; }

/* ─── Day header: the hero, scaled down for daily use ─── */
.day-head { position: relative; overflow: hidden; background: var(--paper); border-bottom: 1px solid var(--line); padding: 26px 18px 20px; }
.head-photo {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-size: cover; background-position: center 32%;
  opacity: 0.16; filter: grayscale(0.3) contrast(0.92);
}
.head-photo::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.2) 45%, rgba(255,255,255,0.9) 100%);
}
.day-head::before, .day-head::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; filter: blur(10px); z-index: 0; }
.day-head::before { width: 560px; height: 420px; top: -200px; left: -200px; background: radial-gradient(ellipse, rgba(0,68,223,0.10) 0%, transparent 68%); }
.day-head::after { width: 540px; height: 420px; bottom: -240px; right: -200px; background: radial-gradient(ellipse, rgba(220,142,9,0.14) 0%, transparent 68%); }
.day-head > .col { position: relative; z-index: 1; }

.status { font-size: 10px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: var(--blue); display: block; margin-bottom: 10px; }
.status[data-tone="rest"] { color: var(--gold-ink); }
.status[data-tone="wip"] { color: var(--magenta); }
.status[data-tone="locked"], .status[data-tone="empty"] { color: var(--ink-3); }
.day-title { font-family: var(--display); font-weight: 400; font-size: clamp(50px, 13vw, 84px); line-height: 0.86; letter-spacing: -0.5px; color: var(--ink); }
.day-title em { font-style: normal; color: var(--blue); display: block; }

.week-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 10px; }
.week-label { font-family: var(--display); font-size: 21px; letter-spacing: 1px; color: var(--ink-2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wk {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 4px;
  padding: 9px 0 8px; transition: border-color .15s, background .15s;
}
.wk:hover { border-color: var(--blue); }
.wk-dow { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); }
.wk-num { font-family: var(--display); font-size: clamp(26px, 7vw, 34px); line-height: 0.9; color: var(--ink); font-variant-numeric: tabular-nums; }
.wk[data-rest] .wk-num { color: var(--ink-3); }
.wk[data-none] { background: transparent; }
.wk[data-none] .wk-num { color: #B6BECC; }
.wk[data-today] { border-top-color: var(--gold); }
.wk[aria-current="date"] { border-color: var(--blue); border-top-color: var(--blue); background: var(--blue-soft); }
.wk[aria-current="date"] .wk-num, .wk[aria-current="date"] .wk-dow { color: var(--blue); }

/* ─── Day body ─── */
.day-body { max-width: calc(var(--col) + 32px); margin: 0 auto; padding: 18px 12px calc(64px + env(safe-area-inset-bottom)); }
.note {
  font-size: 15px; line-height: 1.65; color: var(--ink-2);
  background: var(--blue-soft); border-left: 4px solid var(--blue); border-radius: 0 4px 4px 0;
  padding: 16px 20px; margin-bottom: 12px; white-space: pre-line;
}
.note b { color: var(--ink); font-weight: 600; }
.note--wip { background: rgba(204,18,102,0.06); border-left-color: var(--magenta); }
.note--wip b { color: var(--magenta); }
.progress { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line); padding: 9px 14px; border-radius: 3px; display: inline-block; margin-bottom: 12px; }
.progress strong { color: var(--blue); font-weight: 800; }
.blk { font-family: var(--display); font-size: 30px; letter-spacing: 1px; color: var(--ink); line-height: 1; margin: 26px 4px 10px; display: flex; align-items: center; gap: 12px; }
.blk::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.blk:first-child { margin-top: 6px; }

/* ─── Workout card ─── */
.card {
  --accent: var(--blue); --accent-ink: var(--blue);
  position: relative; overflow: hidden; margin-bottom: 12px; scroll-margin-top: 78px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; height: 4px; width: 30%;
  background: var(--accent); transition: width .7s cubic-bezier(.2,.8,.2,1);
}
.card[data-state="logged"]::before { width: 100%; }
.card[data-state="unscored"]::before { width: 100%; background: var(--line); }
.card-hd { padding: 22px 20px 0; }
.card-key { font-family: var(--display); font-size: 16px; letter-spacing: 2px; color: var(--accent-ink); line-height: 1; }
.card-title { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 0.95; color: var(--ink); margin-top: 4px; letter-spacing: 0.3px; }
.card-fmt { font-size: 9.5px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--accent-ink); margin-top: 8px; }
.card[data-state="unscored"] .card-fmt { color: var(--ink-3); }
.card-text { padding: 12px 20px 20px; font-size: 15.5px; line-height: 1.65; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.card-text a { color: var(--blue); font-weight: 600; text-decoration: none; border-bottom: 2px solid rgba(0,68,223,0.25); }

.video-btn {
  display: inline-flex; align-items: center; gap: 7px; vertical-align: baseline;
  font-size: 10px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--blue); background: var(--blue-soft); border: 1px solid rgba(0,68,223,0.22); border-radius: 3px; padding: 6px 10px;
}
.video-btn:hover { background: var(--blue); color: #fff; }
.video-btn[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.video-wrap { position: relative; width: 100%; max-width: 560px; aspect-ratio: 16 / 9; margin: 10px 0 6px; background: #000; border-radius: 4px; overflow: hidden; white-space: normal; }
.video-wrap--vertical { max-width: 300px; aspect-ratio: 9 / 16; }
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.card-notes { padding: 0 20px 18px; margin-top: -6px; }
.day-notes { margin: -4px 0 12px; }
.notes-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--gold-ink); background: var(--paper); border: 2px solid var(--gold); border-radius: 3px; padding: 8px 12px;
}
.notes-btn::after { content: '+'; font-size: 15px; line-height: 1; font-weight: 700; }
.notes-btn[aria-expanded="true"] { background: var(--gold); color: var(--ink); }
.notes-btn[aria-expanded="true"]::after { content: '−'; }
.notes-btn:hover { background: rgba(220,142,9,0.12); }
.notes-btn[aria-expanded="true"]:hover { background: var(--gold-lt); }
.coach-notes { margin-top: 10px; background: rgba(220,142,9,0.08); border-left: 4px solid var(--gold); border-radius: 0 4px 4px 0; padding: 14px 16px; }
.coach-notes-text { font-size: 15px; line-height: 1.65; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.coach-notes-text a { color: var(--blue); font-weight: 600; text-decoration: none; border-bottom: 2px solid rgba(0,68,223,0.25); }
.notes-vis { display: inline-block; margin-bottom: 8px; }
.note a { color: var(--blue); font-weight: 600; text-decoration: none; border-bottom: 2px solid rgba(0,68,223,0.25); }
.panel { border-top: 1px solid var(--line); background: #FAFBFE; padding: 16px 20px 20px; }
.panel-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.panel.panel--visitor { padding-top: 8px; padding-bottom: 8px; background: var(--paper); }
.panel--visitor .text-btn { padding: 10px 0; text-align: left; line-height: 1.5; }

/* Logged score */
.logged { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: end; }
.logged-score { font-family: var(--display); font-size: clamp(46px, 13vw, 66px); line-height: 0.85; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
.logged-score[data-capped] { color: var(--magenta); font-size: clamp(34px, 9vw, 46px); }
.logged-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-self: end; }
.tag { font-size: 9.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 9px; border-radius: 3px; color: var(--blue); background: var(--blue-soft); border: 1px solid rgba(0,68,223,0.2); }
.tag[data-v="scaled"] { color: var(--orange-ink); background: rgba(224,122,28,0.09); border-color: rgba(224,122,28,0.3); }
.tag--quiet { color: var(--ink-3); background: var(--wash); border-color: var(--line); }
.set-list { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.set-chip { font-family: var(--display); font-size: 18px; letter-spacing: 0.5px; color: var(--ink-2); background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px 3px; }
.set-chip[data-missed] { color: var(--magenta); text-decoration: line-through; text-decoration-thickness: 2px; }
.logged-notes { grid-column: 1 / -1; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); margin-top: 10px; font-style: italic; white-space: pre-line; }
.logged-acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.stamp { animation: stamp .45s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes stamp { from { transform: scale(1.18); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Score entry: scoreboard scale */
.entry-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cells { display: flex; gap: 8px; align-items: stretch; max-width: 460px; }
.cell {
  flex: 1 1 0; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--accent);
  border-radius: 4px; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center;
}
.cell:focus-within { border-color: var(--accent); box-shadow: 0 6px 20px rgba(20,22,28,0.08); }
.cell label { font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); }
.cell input {
  width: 100%; border: 0; background: transparent; outline: none; text-align: center;
  font-family: var(--display); font-size: clamp(48px, 14vw, 64px); line-height: 1; color: var(--ink);
  font-variant-numeric: tabular-nums; padding: 4px 0 0; -moz-appearance: textfield;
}
.cell input::placeholder { color: #C9D0DC; }
.colon { font-family: var(--display); font-size: 48px; color: var(--ink-3); align-self: center; padding-top: 14px; }
.sets-grid { max-width: 580px; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.sets-grid .cell input { font-size: 38px; }
.miss { margin-top: 4px; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-3); padding: 5px 8px; border-radius: 3px; }
.miss[aria-pressed="true"] { color: #fff; background: var(--magenta); }
.set-row { display: grid; grid-template-columns: 54px 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-row .set-n { font-family: var(--display); font-size: 18px; letter-spacing: 1px; color: var(--ink-3); }
.set-row .cell input { font-size: 34px; }
.set-row .colon { font-size: 30px; padding-top: 10px; }
.unit-lab { font-family: var(--display); font-size: 22px; letter-spacing: 1px; color: var(--ink-3); align-self: center; }

.cap-toggle { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none; }
.cap-toggle input { width: 20px; height: 20px; accent-color: var(--magenta); }
.cap-toggle b { color: var(--magenta); font-weight: 700; }

.field { display: block; margin-top: 12px; }
.field > span { display: block; font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.input, textarea.input, select.input {
  width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 3px;
  font-size: 16px; line-height: 1.5; padding: 12px 14px; color: var(--ink); outline: none; transition: border-color .15s;
}
.input:focus { border-color: var(--blue); }
textarea.input { resize: vertical; min-height: 64px; }
.entry-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
.err { color: var(--magenta); font-size: 13.5px; font-weight: 600; line-height: 1.5; }
.err:empty { display: none; }

.faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.face { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 4px; padding: 10px 0 8px; font-size: 26px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.face small { font-family: var(--display); font-size: 16px; color: var(--ink-3); }
.face:hover { border-color: var(--accent); }
.face[aria-pressed="true"] { border-color: var(--accent); background: var(--blue-soft); }

/* Feel + message cards */
.plain-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 22px 20px; margin-top: 12px; position: relative; overflow: hidden; }
.plain-card--grad::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--grad); }
.plain-title { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--ink); margin-bottom: 8px; }
.plain-card p { font-size: 15px; line-height: 1.65; color: var(--ink-2); max-width: 560px; }
.plain-card .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.feel-row { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.feel-row .seg { width: 100%; }
.feel-row .seg button { flex: 1; font-size: 24px; padding: 12px 0; }
.feel-ends { display: flex; justify-content: space-between; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); }
.loading { text-align: center; padding: 60px 0; font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-3); }

/* ─── Sheets (dialogs) ─── */
dialog.sheet {
  border: 0; padding: 0; margin: auto; width: min(580px, calc(100% - 32px)); max-height: min(88dvh, 860px);
  background: var(--paper); color: var(--ink); border-radius: 6px; overflow: hidden;
